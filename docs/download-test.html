<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>InkDay download test</title></head>
<body style="font-family:sans-serif;font-size:2em;text-align:center;margin-top:2em">
<p>InkDay download test</p>
<p><a id="link" download="inkday-auth.txt">Tap to download</a></p>
<p id="status"></p>
<script>
  var blob = new Blob(["code=TEST123&state=abc\n"], {type: "text/plain"});
  var link = document.getElementById("link");
  link.href = URL.createObjectURL(blob);
  try { link.click(); document.getElementById("status").textContent = "auto-download triggered"; }
  catch (e) { document.getElementById("status").textContent = "auto failed: " + e; }
</script>
</body>
</html>
